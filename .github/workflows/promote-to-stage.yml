name: Promote main to stage

# Mantiene la rama `stage` alineada con `main` para que el deploy de Amplify
# al ambiente BETA (api.stage.simuladores.mexicalab.com) ocurra en cada merge.
# Sin esto, `stage` queda a la deriva porque los PRs mergean directo a main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-main-to-stage
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Push main to stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:stage
